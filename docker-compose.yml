services:
  postgres:
    image: postgres:16-alpine
    container_name: comment-insight-postgres
    environment:
      POSTGRES_USER: comment_insight
      POSTGRES_PASSWORD: comment_insight
      POSTGRES_DB: comment_insight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: comment-insight-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: comment-insight-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:

